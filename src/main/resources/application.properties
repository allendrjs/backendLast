spring.application.name=osdrmsa-appl

#Server Port
server.port=8080

#Database Configuration
# Set DB_URL / DB_USERNAME / DB_PASSWORD as environment variables (or in a
# git-ignored application-local.properties). Never commit real credentials.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:rcosd}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver

#JWT Configuration
# Set JWT_SECRET as an environment variable in every real environment.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}


spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
# Spring Boot's default SpringPhysicalNamingStrategy rewrites every column
# name to snake_case (e.g. "dateFiled" -> "date_filed"), even ones set
# explicitly via @Column(name=...). The DB schema was created from a raw
# Oracle DDL script with unquoted (mixed-case-as-written) identifiers, which
# Oracle folds to uppercase with no inserted underscores (e.g. DATEFILED).
# Reverting to Hibernate's standard strategy passes @Column names through
# unchanged so they match Oracle's case-insensitive identifier comparison.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true